; PickUp Audio(架上知音) 支架固件 · ESP32-C3 SuperMini
; 烧录: pio run -t upload --upload-port COM8 (或上位机一键烧录)

[env:esp32c3]
; 平台锁定版本:保证构建可复现(LGPL relinking 论证)与 CI 稳定,升级需显式改这里
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1          ; C3 硬件 USB Serial/JTAG(固定功能,Win10/11 免驱)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial 即 USB CDC(与协议共用同一端口)
monitor_speed = 115200
;构建前脚本注入 -fmacro-prefix-map:剥离固件二进制里构建机的
;构建机用户目录下的 .platformio/... 绝对路径(隐私)。不能直接写 build_flags——
;${platformio.packages_dir} 展开为反斜杠而 __FILE__ 是正斜杠,映射键对不上
extra_scripts = pre:fix_paths.py
upload_port = COM8
